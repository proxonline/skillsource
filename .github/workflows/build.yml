name: Build Electron App

on:
  push:
    branches:
      - codex/convert-react-app-to-electron-desktop-app

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run dist
